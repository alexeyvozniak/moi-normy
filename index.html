  <section class="hero">
    <button class="quoteCard" id="dayQuote" type="button">
      <div class="quoteLabel">Слово дня</div><div class="quoteText" id="dayQuoteText"></div><div class="quoteAuthor" id="dayQuoteAuthor"></div><div class="quoteTap">нажми, чтобы перелистнуть</div>
    </button>
  </section>

  <nav class="tabs" aria-label="Разделы">
    <button class="tab active" data-tab="today" type="button">Сегодня</button>
    <button class="tab" data-tab="week" type="button">Неделя</button>
    <button class="tab" data-tab="history" type="button">История</button>
    <button class="tab" data-tab="catalog" type="button">Образы</button>
  </nav>

  <section id="todayView"><div class="stats" id="stats"></div><div class="cards" id="cards"></div></section>
  <section id="weekView" class="hidden"><div class="sectionTitle">Последние 7 дней</div><div class="panel" id="weekPanel"></div></section>
  <section id="historyView" class="hidden"><div class="sectionTitle">История</div><div class="panel" id="historyPanel"></div></section>
  <section id="catalogView" class="hidden"><div class="sectionTitle">Образы</div><div class="gallery" id="catalog"></div></section>
</main>

<div class="overlay" id="amountOverlay">
  <div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle" id="amountTitle">Списать</div><button class="closeBtn" type="button" data-close="amountOverlay">✕</button></div><div class="field"><label>Сколько выполнено?</label><input id="amountInput" type="number" inputmode="decimal" min="0" step="1"></div><div class="smallText" id="amountHint"></div><div class="sheetActions"><button class="button" type="button" data-close="amountOverlay">Отмена</button><button class="button primary" type="button" id="amountSave">Списать</button></div></div>
</div>

<div class="overlay" id="editorOverlay">
  <div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle" id="editorTitle">Новая норма</div><button class="closeBtn" type="button" data-close="editorOverlay">✕</button></div>
    <div class="field"><label>Название</label><input id="eName"></div>
    <div class="two"><div class="field"><label>Начислять</label><input id="eIncrement" type="number" min="0" step="1"></div><div class="field"><label>Единица</label><input id="eUnit"></div></div>
    <div class="two"><div class="field"><label>Период</label><select id="ePeriod"><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="monthly">Каждый месяц</option><option value="interval">Каждые N дней</option></select></div><div class="field"><label>Быстро списать</label><input id="eQuick" type="number" min="0" step="1"></div></div>
    <div class="field hidden" id="intervalField"><label>Раз в сколько дней</label><input id="eIntervalDays" type="number" min="1" value="2"></div>
    <div class="field"><label>Текущий долг</label><input id="eDebt" type="number" min="0"></div>
    <div class="toggleRow"><div>Пауза</div><button class="switch" id="pauseSwitch" type="button" aria-label="Пауза"></button></div>
    <div class="field"><label>Изображение</label><div class="pickerGrid" id="imagePicker"></div></div>
    <div class="field"><label>Свой URL изображения</label><input id="eImageUrl"></div>
    <div class="sheetActions"><button class="button danger" type="button" id="deleteTask">Удалить</button><button class="button" type="button" data-close="editorOverlay">Отмена</button><button class="button primary" type="button" id="saveTask">Сохранить</button></div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle">Настройки</div><button class="closeBtn" type="button" data-close="settingsOverlay">✕</button></div>
    <div class="panel"><b>Данные хранятся на этом устройстве</b><div class="smallText">Резервная копия пригодится на случай очистки данных браузера.</div></div>
    <div class="sheetActions"><button class="button" type="button" id="exportBtn">Экспорт</button><button class="button" type="button" id="importBtn">Импорт</button></div>
    <input id="importFile" type="file" accept=".json,application/json" class="hidden">
    <div class="sheetActions"><button class="button danger" type="button" id="clearHistory">Очистить историю</button><button class="button danger" type="button" id="resetAll">Сбросить всё</button></div>
  </div>
</div>

<script src="app-bootstrap.js?v=34.3" defer></script>

</html>
