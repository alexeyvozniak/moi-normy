<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ede3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Правило">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Правило</title>
<style>
:root{--bg:#f3ede3;--paper:#fbf7f0;--paper2:#f7f1e8;--ink:#1b1814;--muted:#756d63;--hair:#d8cdbf;--soft:#ede4d8;--green:#68745f;--green2:#7b8670;--red:#bd5842;--shadow:0 10px 28px rgba(71,48,22,.065);--serif:ui-serif,"Iowan Old Style","Baskerville","Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}button,input,select{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}.hidden{display:none!important}
.app{max-width:720px;margin:auto;padding:calc(env(safe-area-inset-top) + 15px) 14px calc(env(safe-area-inset-bottom) + 32px)}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:3px 3px 14px}.title{font:500 38px/.95 var(--serif)}.date{margin-top:7px;color:var(--muted);font-size:13px}.headActions{display:flex;gap:7px}.roundButton{width:43px;height:43px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--hair);background:var(--paper);font-size:21px}.hero{position:relative;overflow:hidden;border:1px solid var(--hair);border-radius:24px;min-height:206px;background:url("images/hero.webp") center/cover no-repeat;box-shadow:var(--shadow)}.quoteCard{position:absolute;left:15px;bottom:14px;max-width:82%;padding:14px 15px;background:rgba(251,247,240,.94);border-radius:17px;border:1px solid var(--hair)}.quoteLabel{font-size:9px;text-transform:uppercase;color:var(--red);font-weight:750}.quoteText{font:500 18px/1.26 var(--serif);margin-top:8px}.quoteAuthor,.quoteTap{font-size:10px;color:var(--muted);margin-top:7px}.tabs{display:flex;gap:7px;overflow:auto;padding:14px 0 13px}.tab{white-space:nowrap;border:1px solid var(--hair);background:var(--paper);padding:10px 16px;border-radius:999px;font-size:13px}.tab.active{background:var(--green);border-color:var(--green);color:white}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat,.task,.panel,.galleryCard{background:var(--paper);border:1px solid var(--hair);box-shadow:var(--shadow)}.stat{border-radius:18px;padding:10px;display:flex;align-items:center;gap:8px}.stat img{width:39px;height:39px;border-radius:50%;object-fit:cover}.statNum{font:500 24px/.9 var(--serif)}.statLabel{font-size:9px;color:var(--muted)}.cards{display:flex;flex-direction:column;gap:10px}.task{border-radius:22px;padding:15px}.taskTop{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px}.taskName{font:500 29px/.98 var(--serif)}.taskRule{color:var(--green2);font-size:12px;margin-top:4px}.taskImage{width:118px;height:88px;border-radius:15px;object-fit:cover}.debtLine{display:flex;align-items:flex-end;gap:8px;margin-top:16px}.debtNumber{font:500 52px/.78 var(--serif)}.debtUnit,.debtNote{font-size:11px;color:var(--muted)}.controlRow{display:grid;grid-template-columns:1.15fr .85fr .9fr;gap:7px;margin-top:14px}.button{min-height:43px;border-radius:13px;border:1px solid var(--hair);background:var(--paper2);padding:9px 10px}.button.primary{background:var(--green);border-color:var(--green);color:white}.subRow{display:flex;gap:7px;margin-top:8px}.wordButton,.editButton{min-height:35px;border-radius:11px;border:1px solid var(--hair);background:transparent;color:var(--muted);padding:7px 10px;font-size:10px}.sectionTitle{font:500 22px var(--serif);margin:8px 2px 12px}.panel{border-radius:20px;padding:15px}.weekItem,.historyItem{padding:11px 0;border-bottom:1px solid var(--hair)}.historyItem{display:grid;grid-template-columns:1fr auto;gap:10px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.galleryCard{overflow:hidden;border-radius:17px}.galleryCard img{width:100%;aspect-ratio:4/3;object-fit:cover}.galleryMeta{padding:9px}.empty{text-align:center;padding:28px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(28,20,12,.28);align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:12px 15px calc(env(safe-area-inset-bottom) + 18px)}.grabber{width:37px;height:4px;border-radius:999px;background:#c9beb1;margin:0 auto 14px}.sheetHeader{display:flex;justify-content:space-between;align-items:center}.sheetTitle{font:500 28px var(--serif)}.closeBtn{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%}.field{margin:12px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--hair);background:#fffaf4;border-radius:13px;padding:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toggleRow{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--hair)}.switch{width:49px;height:30px;border:0;background:#cbc2b7;border-radius:999px}.switch.on{background:var(--green)}.pickerGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pick{border:2px solid transparent;border-radius:15px;overflow:hidden;background:var(--paper2);padding:0}.pick img{width:100%;aspect-ratio:4/3;object-fit:cover}.pick span{display:block;padding:7px}.pick.selected{border-color:var(--red)}.sheetActions{display:flex;gap:8px;margin-top:16px}.sheetActions .button{flex:1}.danger{color:#9f4938}.smallText{font-size:9px;color:var(--muted)}.quoteBox{padding:18px;background:var(--paper2);border-radius:19px}.quoteBig{font:500 24px/1.3 var(--serif);margin-top:12px}
</style>
</head>
<body>
<main class="app"><header class="header"><div><div class="title">Правило</div><div class="date" id="date"></div></div><div class="headActions"><button class="roundButton" id="addBtn">＋</button><button class="roundButton" id="settingsBtn">⚙</button></div></header><section class="hero"><button class="quoteCard" id="dayQuote"><div class="quoteLabel">Слово дня</div><div class="quoteText" id="dayQuoteText"></div><div class="quoteAuthor" id="dayQuoteAuthor"></div><div class="quoteTap">нажми, чтобы перелистнуть</div></button></section><nav class="tabs"><button class="tab active" data-tab="today">Сегодня</button><button class="tab" data-tab="week">Неделя</button><button class="tab" data-tab="history">История</button><button class="tab" data-tab="catalog">Образы</button></nav><section id="todayView"><div class="stats" id="stats"></div><div class="cards" id="cards"></div></section><section id="weekView" class="hidden"><div class="sectionTitle">Последние 7 дней</div><div class="panel" id="weekPanel"></div></section><section id="historyView" class="hidden"><div class="sectionTitle">История</div><div class="panel" id="historyPanel"></div></section><section id="catalogView" class="hidden"><div class="sectionTitle">Образы</div><div class="gallery" id="catalog"></div></section></main>
<div class="overlay" id="amountOverlay"><div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle" id="amountTitle">Списать</div><button class="closeBtn" data-close="amountOverlay">✕</button></div><div class="field"><label>Сколько выполнено?</label><input id="amountInput" type="number" inputmode="decimal" min="0" step="1"></div><div class="smallText" id="amountHint"></div><div class="sheetActions"><button class="button" data-close="amountOverlay">Отмена</button><button class="button primary" id="amountSave">Списать</button></div></div></div>
<div class="overlay" id="editorOverlay"><div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle" id="editorTitle">Новая норма</div><button class="closeBtn" data-close="editorOverlay">✕</button></div><div class="field"><label>Название</label><input id="eName"></div><div class="two"><div class="field"><label>Начислять</label><input id="eIncrement" type="number" min="0" step="1"></div><div class="field"><label>Единица</label><input id="eUnit"></div></div><div class="two"><div class="field"><label>Период</label><select id="ePeriod"><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option><option value="monthly">Каждый месяц</option><option value="interval">Каждые N дней</option></select></div><div class="field"><label>Быстро списать</label><input id="eQuick" type="number" min="0" step="1"></div></div><div class="field hidden" id="intervalField"><label>Раз в сколько дней</label><input id="eIntervalDays" type="number" min="1" value="2"></div><div class="field"><label>Текущий долг</label><input id="eDebt" type="number" min="0"></div><div class="field"><label>Тема цитат</label><select id="eTheme"><option value="auto">Автоматически</option><option value="jesus">Иисусова молитва</option><option value="reading">Чтение и учёба</option><option value="contemplation">Созерцательная молитва</option><option value="orthodox">Православное созерцание</option><option value="catholic">Католическое созерцание</option><option value="work">Труд и терпение</option><option value="rest">Покой и восстановление</option><option value="general">Общие</option></select></div><div class="toggleRow"><div>Пауза</div><button class="switch" id="pauseSwitch"></button></div><div class="field"><label>Изображение</label><div class="pickerGrid" id="imagePicker"></div></div><div class="field"><label>Свой URL изображения</label><input id="eImageUrl"></div><div class="sheetActions"><button class="button danger" id="deleteTask">Удалить</button><button class="button" data-close="editorOverlay">Отмена</button><button class="button primary" id="saveTask">Сохранить</button></div></div></div>
<div class="overlay" id="quoteOverlay"><div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle">Слово</div><button class="closeBtn" data-close="quoteOverlay">✕</button></div><div class="quoteBox"><div id="qTheme"></div><div class="quoteBig" id="qText"></div><div id="qAuthor"></div><div id="qSource"></div></div><div class="sheetActions"><button class="button primary" id="nextQuote">Ещё одно</button><button class="button" data-close="quoteOverlay">Готово</button></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="grabber"></div><div class="sheetHeader"><div class="sheetTitle">Настройки</div><button class="closeBtn" data-close="settingsOverlay">✕</button></div><div class="panel"><b>Данные хранятся на iPhone</b><div class="smallText">Резервная копия нужна на случай очистки данных Safari.</div></div><div class="sheetActions"><button class="button" id="exportBtn">Экспорт</button><button class="button" id="importBtn">Импорт</button></div><input id="importFile" type="file" accept=".json,application/json" class="hidden"><div class="sheetActions"><button class="button danger" id="clearHistory">Очистить историю</button><button class="button danger" id="resetAll">Сбросить всё</button></div></div></div>
<script>
const STORAGE_KEY='pravilo_v1';
const assets=[{id:'prayer',name:'Молитва',src:'images/prayer_person_beads.webp',tags:'молитва'},{id:'reading',name:'Чтение',src:'images/reading_person_book.webp',tags:'чтение'},{id:'contemplation',name:'Созерцание',src:'images/contemplation_looking_up.webp',tags:'тишина'},{id:'sport',name:'Тренировка',src:'images/samurai_training.webp',tags:'спорт'},{id:'onsen',name:'Отдых',src:'images/selfcare_onsen.webp',tags:'отдых'},{id:'calligraphy',name:'Каллиграфия',src:'images/calligraphy_ink.webp',tags:'творчество'},{id:'wanderer',name:'Путь',src:'images/walking_path.webp',tags:'прогулка'},{id:'book',name:'Книга',src:'images/open_book.webp',tags:'чтение'},{id:'desk',name:'Рабочий стол',src:'images/books_notes.webp',tags:'работа'},{id:'enso',name:'Энсо',src:'images/enso.webp',tags:'образ'}];
const quotes=[{t:['general','jesus'],text:'Молитву совершай с усердием и со вниманием.',author:'прп. Антоний Великий',source:'Духовные наставления'},{t:['reading','general'],text:'Из всего старайся извлекать себе назидание.',author:'прп. авва Дорофей',source:'Наставления'},{t:['work','general'],text:'Во всём спрашивай прежде свою совесть.',author:'прп. авва Дорофей',source:'Наставления'},{t:['rest','contemplation','general'],text:'Возлюби безмолвие гораздо более дел.',author:'прп. Исаак Сирин',source:'Слово 40'}];
const themes={jesus:'Иисусова молитва',reading:'Чтение и учёба',contemplation:'Созерцание',orthodox:'Православное созерцание',catholic:'Созерцание',work:'Труд и терпение',rest:'Покой',general:'Слово'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function freshState(){return {version:1,dayQuoteOffset:0,items:[{id:uid(),name:'Иисусова молитва',increment:200,unit:'молитв',period:'daily',intervalDays:1,quick:50,debt:200,theme:'jesus',image:'images/prayer_person_beads.webp',paused:false,lastAccrual:today()},{id:uid(),name:'Чтение',increment:15,unit:'страниц',period:'daily',intervalDays:1,quick:5,debt:15,theme:'reading',image:'images/reading_person_book.webp',paused:false,lastAccrual:today()},{id:uid(),name:'Созерцание',increment:1,unit:'сессий',period:'weekly',intervalDays:7,quick:1,debt:1,theme:'contemplation',image:'images/contemplation_looking_up.webp',paused:false,lastAccrual:today()}],history:[]}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(s&&Array.isArray(s.items))return s}catch(e){}return freshState()}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}let state=load(),editId=null,amountId=null,selectedImage='',quoteTheme='general',quoteIndex=0,currentTab='today';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('date').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const q=quotes[(new Date().getDate()+state.dayQuoteOffset)%quotes.length];dayQuoteText.textContent=q.text;dayQuoteAuthor.textContent='— '+q.author;stats.innerHTML=`<div class="stat"><div><div class="statNum">${state.items.filter(i=>!i.paused).length}</div><div class="statLabel">активных норм</div></div></div><div class="stat"><div><div class="statNum">${state.items.filter(i=>i.debt>0&&!i.paused).length}</div><div class="statLabel">с долгом</div></div></div><div class="stat"><div><div class="statNum">${state.history.filter(h=>h.day===today()).length}</div><div class="statLabel">сделано сегодня</div></div></div>`;cards.innerHTML=state.items.map(i=>`<article class="task"><div class="taskTop"><div><div class="taskName">${esc(i.name)}</div><div class="taskRule">+${i.increment} ${i.period==='daily'?'каждый день':i.period==='weekly'?'каждую неделю':i.period==='monthly'?'каждый месяц':`каждые ${i.intervalDays} дн.`}</div></div><img class="taskImage" src="${esc(i.image)}"></div><div class="debtLine"><div class="debtNumber">${i.debt}</div><div class="debtUnit">${esc(i.unit)} осталось</div></div><div class="controlRow"><button class="button primary" onclick="openAmount('${i.id}')">Списать</button><button class="button" onclick="subtract('${i.id}',${i.quick})">−${i.quick}</button><button class="button" onclick="subtract('${i.id}',${i.debt})">Закрыть</button></div><div class="subRow"><button class="wordButton" onclick="openQuoteFor('${i.id}')">✦ Слово</button><button class="editButton" onclick="openEditor('${i.id}')">Изменить</button></div></article>`).join('');renderWeek();renderHistory();renderCatalog()}
function subtract(id,n){const i=state.items.find(x=>x.id===id);if(!i)return;n=Math.min(i.debt,Math.max(0,Number(n)||0));if(!n)return;i.debt-=n;state.history.unshift({id:uid(),ts:new Date().toISOString(),day:today(),itemId:i.id,item:i.name,amount:n,unit:i.unit});save();render()}
function renderWeek(){weekPanel.innerHTML=state.items.map(i=>`<div class="weekItem"><b>${esc(i.name)}</b> · осталось ${i.debt} ${esc(i.unit)}</div>`).join('')||'<div class="empty">Пока пусто.</div>'}function renderHistory(){historyPanel.innerHTML=state.history.slice(0,80).map(h=>`<div class="historyItem"><div><b>${esc(h.item)}</b><div class="smallText">${new Date(h.ts).toLocaleString('ru-RU')}</div></div><div>−${h.amount}</div></div>`).join('')||'<div class="empty">История пока пуста.</div>'}function renderCatalog(){catalog.innerHTML=assets.map(a=>`<div class="galleryCard"><img src="${a.src}"><div class="galleryMeta"><b>${a.name}</b><div class="smallText">${a.tags}</div></div></div>`).join('')}
function show(id){document.getElementById(id).classList.add('show')}function hide(id){document.getElementById(id).classList.remove('show')}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));['today','week','history','catalog'].forEach(x=>document.getElementById(x+'View').classList.toggle('hidden',x!==b.dataset.tab))});
function openAmount(id){amountId=id;const i=state.items.find(x=>x.id===id);amountTitle.textContent='Списать: '+i.name;amountHint.textContent=`Сейчас осталось ${i.debt} ${i.unit}.`;amountInput.value='';show('amountOverlay')}amountSave.onclick=()=>{subtract(amountId,amountInput.value);hide('amountOverlay')};
function picker(){imagePicker.innerHTML=assets.map(a=>`<button class="pick ${selectedImage===a.src?'selected':''}" onclick="selectImage('${a.src}')"><img src="${a.src}"><span>${a.name}</span></button>`).join('')}function selectImage(src){selectedImage=src;eImageUrl.value='';picker()}
function openEditor(id=null){editId=id;const i=id?state.items.find(x=>x.id===id):null;editorTitle.textContent=i?'Изменить норму':'Новая норма';eName.value=i?.name||'';eIncrement.value=i?.increment??1;eUnit.value=i?.unit||'';ePeriod.value=i?.period||'daily';eIntervalDays.value=i?.intervalDays??2;eQuick.value=i?.quick??1;eDebt.value=i?.debt??1;eTheme.value=i?.theme||'auto';selectedImage=i?.image||'images/enso.webp';eImageUrl.value='';pauseSwitch.classList.toggle('on',!!i?.paused);deleteTask.classList.toggle('hidden',!i);picker();show('editorOverlay')}saveTask.onclick=()=>{let i=editId?state.items.find(x=>x.id===editId):{id:uid(),lastAccrual:today()};i.name=eName.value.trim()||'Новая норма';i.increment=Math.max(0,Number(eIncrement.value)||0);i.unit=eUnit.value.trim()||'ед.';i.period=ePeriod.value;i.intervalDays=Math.max(1,Number(eIntervalDays.value)||2);i.quick=Math.max(.01,Number(eQuick.value)||1);i.debt=Math.max(0,Number(eDebt.value)||0);i.theme=eTheme.value;i.image=eImageUrl.value.trim()||selectedImage;i.paused=pauseSwitch.classList.contains('on');if(!editId)state.items.push(i);save();hide('editorOverlay');render()};deleteTask.onclick=()=>{if(editId&&confirm('Удалить норму?')){state.items=state.items.filter(i=>i.id!==editId);save();hide('editorOverlay');render()}};pauseSwitch.onclick=()=>pauseSwitch.classList.toggle('on');ePeriod.onchange=()=>intervalField.classList.toggle('hidden',ePeriod.value!=='interval');
function openQuoteFor(id){const i=state.items.find(x=>x.id===id);quoteTheme=i?.theme==='auto'?'general':i?.theme||'general';quoteIndex=0;showQuote();show('quoteOverlay')}function showQuote(){const p=quotes.filter(q=>q.t.includes(quoteTheme));const q=(p.length?p:quotes)[quoteIndex%(p.length||quotes.length)];qTheme.textContent=themes[quoteTheme]||'Слово';qText.textContent=q.text;qAuthor.textContent='— '+q.author;qSource.textContent=q.source}nextQuote.onclick=()=>{quoteIndex++;showQuote()};dayQuote.onclick=()=>{state.dayQuoteOffset++;save();render()};addBtn.onclick=()=>openEditor();settingsBtn.onclick=()=>show('settingsOverlay');
exportBtn.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='pravilo-backup.json';a.click()};importBtn.onclick=()=>importFile.click();importFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.items))throw 0;state=x;save();render();hide('settingsOverlay')}catch(_){alert('Не удалось прочитать файл.')}};r.readAsText(f)};clearHistory.onclick=()=>{if(confirm('Очистить историю?')){state.history=[];save();render()}};resetAll.onclick=()=>{if(confirm('Полностью сбросить приложение?')){state=freshState();save();render();hide('settingsOverlay')}};
window.openAmount=openAmount;window.subtract=subtract;window.openEditor=openEditor;window.openQuoteFor=openQuoteFor;window.selectImage=selectImage;render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(console.error);
</script>
<script src="app-bootstrap.js?v=30" defer></script>
</body>
</html>
